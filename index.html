<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16223a">
<title>Capy Onsen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="./public/favicon.png">
<link rel="apple-touch-icon" href="./public/apple-touch-icon.png">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="corner">
  <button class="icon-btn" id="sound" aria-label="Toggle sound" aria-pressed="false">
    <canvas width="32" height="32" aria-hidden="true"></canvas>
  </button>
  <button class="icon-btn" id="mixerBtn" aria-label="Sound settings" aria-expanded="false">
    <canvas width="32" height="32" aria-hidden="true"></canvas>
  </button>
  <div id="mixer" class="popover" hidden>
    <label>MUSIC
      <input type="range" id="musicSlider" min="0" max="100" step="1">
    </label>
    <label>SFX
      <input type="range" id="sfxSlider" min="0" max="100" step="1">
    </label>
  </div>
</div>

<div id="ui">
  <div class="title">
    <h1>CAPY ONSEN</h1>
    <div class="jp">温泉</div>
  </div>
  <div class="spacer"></div>
  <div class="grid" id="menu">
    <button class="card-btn" data-game="match">
      <canvas class="ico" width="32" height="32" aria-hidden="true"></canvas><span>MEMORY MATCH</span><span class="best" id="best-match"></span>
    </button>
    <button class="card-btn" data-game="bubble">
      <canvas class="ico" width="32" height="32" aria-hidden="true"></canvas><span>BATH BUBBLES</span><span class="best" id="best-bubble"></span>
    </button>
    <button class="card-btn" data-game="orange">
      <canvas class="ico" width="32" height="32" aria-hidden="true"></canvas><span>ORANGE CATCH</span><span class="best" id="best-orange"></span>
    </button>
    <button class="card-btn" data-game="run">
      <canvas class="ico" width="32" height="32" aria-hidden="true"></canvas><span>CAPY RUN</span><span class="best" id="best-run"></span>
    </button>
    <button class="card-btn" data-game="stack">
      <canvas class="ico" width="32" height="32" aria-hidden="true"></canvas><span>CAPY STACK</span><span class="best" id="best-stack"></span>
    </button>
    <button class="card-btn" data-game="wordle">
      <canvas class="ico" width="32" height="32" aria-hidden="true"></canvas><span>WORDLEBARA</span><span class="best" id="best-wordle"></span>
    </button>
  </div>
  <button class="credit-link" id="creditsBtn" aria-expanded="false">credits</button>
  <p class="credit" id="creditsText" hidden>
    run sprite by <a href="https://rainloaf.itch.io/capybara-sprite-sheet" target="_blank" rel="noopener">Rainloaf</a>
    &middot; music by
    <a href="https://freesound.org/people/YellowTree/" target="_blank" rel="noopener">YellowTree</a>,
    <a href="https://freesound.org/people/Mark_Murray/" target="_blank" rel="noopener">Mark_Murray</a>,
    <a href="https://freesound.org/people/CVLTIV8R/" target="_blank" rel="noopener">CVLTIV8R</a>,
    <a href="https://www.audiocoffee.net/" target="_blank" rel="noopener">AudioCoffee</a>,
    <a href="https://freesound.org/people/zagi2/" target="_blank" rel="noopener">zagi2</a>
  </p>
</div>

<div id="game">
  <div class="bar">
    <button class="back" id="back">← BACK</button>
    <h2 id="gtitle">MEMORY MATCH</h2>
    <span class="stat" id="stat"></span>
  </div>
  <div class="stage">
    <div id="board"></div>
    <canvas id="play"></canvas>
    <div id="word">
      <div id="wtop">
        <canvas id="capyface" width="64" height="44" aria-hidden="true"></canvas>
        <div id="wgrid"></div>
        <button class="hint-btn" id="hintBtn">HINT · 2 LETTERS</button>
      </div>
      <div id="wkeys"></div>
    </div>
    <div id="win"><div class="box">
    <p id="wintext"></p>
    <p class="sub" id="winsub"></p>
    <button class="back" id="again">PLAY AGAIN</button>
    </div></div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
